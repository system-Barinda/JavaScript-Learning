<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two Numbers Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
    }
    form {
        width: 250px;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }
    input {
        display: block;
        margin: 10px 0;
        padding: 8px;
        width: 90%;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .error {
        color: red;
        font-size: 0.9em;
        display: none; 
        margin-bottom: 8px;
    }
</style>
</head>
<body>

<h2>Enter Two Numbers</h2>
<form id="numberForm">
    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">
    <div class="error" id="errorMsg">⚠ Please enter both numbers!</div>
    <button type="submit">Submit</button>
</form>

<script>
    const form = document.getElementById("numberForm");
    const num1 = document.getElementById("num1");
    const num2 = document.getElementById("num2");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", function(event) {
        event.preventDefault(); // Prevent page reload

        if (num1.value === "" || num2.value === "") {
            errorMsg.style.display = "block"; // Show error
        } else {
            errorMsg.style.display = "none"; // Hide error
            alert(`You entered: ${num1.value} and ${num2.value}`);
        }
    });
</script>

</body>
</html>
