<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document of flex</title>
    <style>
        body{
            border: 1px solid black;
            display: flex;
            gap: 10px;
            min-height: 400px;
            align-items: flex-start;  
            
        }
        #box-1{
         
         
        }
        .box{
            height: 80px;
            width: 150px;
            background-color: blue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            
            
            
        }
        @media(max-width:560px){
        body{
        flex-wrap: wrap;
        }
        }
    </style>
</head>
<body>
    <div id="box-1" class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
   
</body>
</html>
