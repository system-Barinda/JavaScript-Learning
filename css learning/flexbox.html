<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document of flex</title>
    <style>
        body{
            border: 1px solid black;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items:center;
            align-content: center;
            min-height: 400px;
            gap: 10px;
            
            
        }
        .box{
            height: 80px;
            width: 100px;
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">9</div>
</body>
</html>
